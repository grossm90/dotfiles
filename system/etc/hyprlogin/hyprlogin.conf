# =============================================================================
# Hyprlogin - Catppuccin Mocha
# Matches your Hyprlock theme
# =============================================================================

$font = Firacode Nerd Font

general {
    hide_cursor = true
    immediate_render = true
    exit_command = hyprctl eval 'hl.dispatch(hl.dsp.exit())'
    fail_timeout = 4000
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    color = rgb(1e1e2e)
}

# =============================================================================
# Clock
# =============================================================================

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 90
    color = rgb(cdd6f4)

    position = 15, 5
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    font_family = $font
    font_size = 25
    color = rgb(cdd6f4)

    position = 15, -125
    halign = left
    valign = top
}

# =============================================================================
# Login Field
# =============================================================================

input-field {
    monitor =

    size = 300, 60
    outline_thickness = 4
    rounding = 10

    inner_color = rgb(313244)        # surface0

    outer_color = rgb(cba6f7)        # mauve
    check_color = rgb(cba6f7)
    fail_color = rgb(f38ba8)

    font_color = rgb(cdd6f4)

    font_family = $font

    fade_on_empty = false

    dots_size = 0.2
    dots_spacing = 0.2

    position = 0, -35
    halign = center
    valign = center

    placeholder_text = Password...
    placeholder_text_username = Username...

    fail_text = <i>$FAIL</i>
}

# =============================================================================
# Active keyboard layout
# =============================================================================

label {
    monitor =
    text = $LAYOUT[en]
    font_family = $font
    font_size = 18
    color = rgb(bac2de)

    onclick = hyprctl switchxkblayout all next

    position = 210, -35
    halign = center
    valign = center
}

# =============================================================================
# Current session
# Click to cycle sessions
# =============================================================================

label {
    monitor =
    text = $GREETD_SESSION
    font_family = $font
    font_size = 15
    color = rgb(9399b2)

    onclick = hyprlogin:session_next

    position = 20, 20
    halign = left
    valign = bottom
}

# =============================================================================
# Greeting (appears after username is selected)
# =============================================================================

label {
    monitor =
    text = Welcome, $GREETD_USER

    font_family = $font
    font_size = 18
    color = rgb(cdd6f4)

    position = 0, 35
    halign = center
    valign = center

    hide_when_empty = true
}
